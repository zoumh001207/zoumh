server:
  port: 9300

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

file:
  prefix: /profile
  path: D:/ruoyi/uploadPath
  domain: https://zoumh.com

storage:
  type: ${STORAGE_TYPE:s3}

referer:
  enabled: false
  allowed-domains: []

webdav:
  enabled: ${WEBDAV_ENABLED:false}
  url: ${WEBDAV_URL:https://data.cstcloud.cn/dav}
  username: ${WEBDAV_USERNAME:zoumh}
  password: ${WEBDAV_PASSWORD:zoumh}
  publicUrl: ${WEBDAV_PUBLIC_URL:https://zoumh.com/prod-api/file/view}

minio:
  url: ${MINIO_URL:http://127.0.0.1:9000}
  accessKey: ${MINIO_ACCESS_KEY:minio}
  secretKey: ${MINIO_SECRET_KEY:zoumh0012078070}
  bucketName: ${MINIO_BUCKET:ruoyi}
  autoCreateBucket: ${MINIO_AUTO_CREATE_BUCKET:true}
  pathStyleAccess: ${MINIO_PATH_STYLE_ACCESS:true}
  region: ${MINIO_REGION:}
  manageBucketPolicy: ${MINIO_MANAGE_BUCKET_POLICY:true}
  domain: ${MINIO_DOMAIN:https://zoumh.com/minio-data}
