spring:
  application:
    name: gateway
  profiles:
    active: @profile.name@
  cloud:
    nacos:
      username: nacos
      password: @nacos.pwd@
      server-addr: @config.server-addr@
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
      config:
        server-addr: ${spring.cloud.nacos.server-addr}
        file-extension: yaml
        data-id: gateway