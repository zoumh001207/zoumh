user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    client_max_body_size  1g;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
    sendfile on;
    keepalive_timeout 65;

    upstream jenkins_server { server jenkins:8080; keepalive 16; }
    upstream nacos_server { server nacos:8848; keepalive 16; }
    upstream xxl_job_server { server xxl-job:8080; keepalive 16; }
    upstream seata_server { server seata:7091; keepalive 16; }
    upstream grafana_server { server grafana:3000; keepalive 16; }
    upstream minio_console { server minio:9001; keepalive 16; }
    upstream minio_api { server minio:9000; keepalive 16; }
    upstream ncm2mp3server { server ncm2mp3:1207; keepalive 16; }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name zoumh.com;

        ssl_certificate     /etc/letsencrypt/live/zoumh.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zoumh.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;

        location /jenkins/ {
            proxy_pass http://jenkins_server/jenkins/;
            proxy_redirect http://$host/jenkins/      https://$host/jenkins/;
            proxy_redirect http://$host:8080/jenkins/ https://$host/jenkins/;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 120s;
        }

        location /nacos/ { proxy_pass http://nacos_server/nacos/; }
        location /xxl-job-admin/ { proxy_pass http://xxl_job_server/xxl-job-admin/; }

        location /seata/ {
            auth_basic "Seata Console";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://seata_server/seata/;
        }

        location /api/ { proxy_pass http://seata_server/seata/api/; }

        location /grafana/ {
            proxy_pass http://grafana_server;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /minio/ {
            proxy_pass http://minio_console/;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        location /minio-data/ {
            proxy_pass http://minio_api/;
            proxy_buffering off;
            proxy_read_timeout 300s;
            set $cors_origin "";
            if ($http_origin ~* "^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$") { set $cors_origin $http_origin; }
            if ($http_origin ~* "^https://zoumh\\.com$") { set $cors_origin $http_origin; }
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
            if ($request_method = OPTIONS) {
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Length 0;
                return 204;
            }
        }

        location /prod-api/ {
            proxy_pass http://172.21.0.1:8080/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /monitor-admin/ {
            proxy_pass http://172.21.0.1:9100/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Prefix /monitor-admin;
            proxy_set_header Connection "";
        }

        location /ncm2mp3/ {
            proxy_pass http://ncm2mp3server/;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            client_max_body_size 200m;
        }

        location /ncm/ {
            proxy_pass http://ncm2mp3server;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            client_max_body_size 200m;
        }

        location / {
            root /www;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(php|asp|aspx|jsp)$ { return 444; }
    }
}
