spring:
  application:
    name: zoumh-hotel-monitor
  profiles:
    active: @profile.name@
  cloud:
    nacos:
      username: nacos
      password: @nacos.pwd@
      server-addr: @config.server-addr@
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
      config:
        server-addr: ${spring.cloud.nacos.server-addr}
        file-extension: yml
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
        data-id: zoumh-hotel-monitor
